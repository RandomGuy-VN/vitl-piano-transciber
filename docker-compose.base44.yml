# ==============================================================================
#   BASE44 DEV COMPOSE — Vitl Piano Discord Bot (Node.js + Python AI Core)
#   Runs from bind-mounted source; port 3000 = web health dashboard.
# ==============================================================================
services:
  vitl-piano-bot:
    build:
      context: .
      dockerfile: Dockerfile.base44
    container_name: vitl_piano_bot_base44
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Live source mount — edits are visible immediately
      - ./:/app
      # Preserve image-installed node_modules over the bind mount
      - /app/node_modules
    environment:
      # Web health server on the preview port
      - PORT=3000
      - ENABLE_HEALTH_SERVER=true
      # CPU-only inference (no GPU in sandbox)
      - DEVICE=cpu
      # Skip model warmup for faster startup (loads on first request instead)
      - PRELOAD_MODEL_ON_STARTUP=true
      # No Discord guilds to style in dev
      - ENABLE_AUTO_STYLE=false
      # Python AI Core binds internally (same container)
      - AI_CORE_HOST=127.0.0.1
      - AI_CORE_PORT=5000
      # Resource limits
      - MAX_CONCURRENT_JOBS=1
      - MAX_FILE_SIZE_MB=50
      - MAX_AUDIO_DURATION_SECONDS=900
      # Optional Discord guild for instant slash command sync
      - GUILD_ID=${GUILD_ID:-}
    env_file:
      - /run/base44/app.env
    command: ["bash", "start.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
