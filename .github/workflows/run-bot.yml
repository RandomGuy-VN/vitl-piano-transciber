name: Run Vitl Piano Discord Bot

on:
  workflow_dispatch: # Cho phép kích hoạt thủ công bằng nút "Run workflow" trên GitHub
  schedule:
    # Tự động khởi động lại bot mỗi 5 tiếng (trước khi chạm ngưỡng giới hạn 6h của GitHub Actions)
    - cron: '0 */5 * * *'

# Ngăn chặn nhiều instance bot chạy đồng thời gây xung đột gateway
concurrency:
  group: vitl-piano-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    name: Run Discord Bot on GitHub Runner
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Giới hạn chạy tối đa ~5.8 tiếng

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & SoX)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg sox libsox-fmt-all

      - name: Install PyTorch CPU & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Automated Self-Test
        run: |
          python -m unittest discover tests

      - name: Start Vitl Piano Bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          DEVICE: 'cpu'
          ENABLE_HEALTH_SERVER: 'false'
          MAX_CONCURRENT_JOBS: '1'
          MAX_FILE_SIZE_MB: '50'
          MAX_AUDIO_DURATION_SECONDS: '900'
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
        run: |
          python main.py
